name: Bztam
options:
  bundleIdPrefix: com.bzrmed
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "26.0"
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: "${APPLE_TEAM_ID}"
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  Bztam:
    type: application
    platform: iOS
    sources:
      - path: Bztam
      - path: Shared
    info:
      path: Bztam/Info.plist
      properties:
        CFBundleDisplayName: Bztam
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, fr]
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        CFBundleURLTypes:
          - CFBundleURLName: com.bzrmed.bztam
            CFBundleURLSchemes:
              - bztam
        ITSAppUsesNonExemptEncryption: false
        NSCameraUsageDescription: Bztam uses the camera to scan your receipts. The text is read on your iPhone.
        NSPhotoLibraryUsageDescription: Bztam looks at your newest screenshot to offer adding bills. Nothing leaves your iPhone.
        NSFaceIDUsageDescription: Bztam uses Face ID to keep your money private when you turn on the lock.
    entitlements:
      path: Bztam/Bztam.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.bzrmed.bztam
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bzrmed.bztam
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Apple Distribution"
          "CODE_SIGN_IDENTITY[sdk=iphoneos*]": "Apple Distribution"
          PROVISIONING_PROFILE_SPECIFIER: "Bztam CI AppStore"
    dependencies:
      - target: BztamShare
        embed: true
  BztamShare:
    type: app-extension
    platform: iOS
    sources:
      - path: BztamShare
      - path: Shared/AppGroup.swift
    info:
      path: BztamShare/Info.plist
      properties:
        CFBundleDisplayName: Bztam
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsImageWithMaxCount: 1
              NSExtensionActivationSupportsFileWithMaxCount: 1
    entitlements:
      path: BztamShare/BztamShare.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.bzrmed.bztam
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bzrmed.bztam.share
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Apple Distribution"
          "CODE_SIGN_IDENTITY[sdk=iphoneos*]": "Apple Distribution"
          PROVISIONING_PROFILE_SPECIFIER: "Bztam CI Share AppStore"
  BztamTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: BztamTests
    dependencies:
      - target: Bztam
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bzrmed.bztam.tests
        GENERATE_INFOPLIST_FILE: YES
  BztamUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: BztamUITests
    dependencies:
      - target: Bztam
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bzrmed.bztam.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Bztam
schemes:
  BztamScreenshots:
    build:
      targets:
        Bztam: all
        BztamShare: all
    test:
      targets:
        - BztamUITests
  Bztam:
    build:
      targets:
        Bztam: all
        BztamShare: all
    test:
      targets:
        - BztamTests
    run:
      config: Debug
    archive:
      config: Release
